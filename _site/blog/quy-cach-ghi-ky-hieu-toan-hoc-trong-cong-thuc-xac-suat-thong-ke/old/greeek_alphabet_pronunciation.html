<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng chữ cái Hy Lạp</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 30px;
    color: #222;
  }
  .container {
    max-width: 720px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
  }
  h1 {
    text-align: center;
    margin-top: 0;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 10px 12px;
    text-align: left;
  }
  th {
    background: #f0f0f0;
  }
  .symbol {
    font-family: "Times New Roman", serif;
    font-size: 30px;
  }
  .name {
    font-weight: 600;
  }
  .pronunciation {
    color: #555;
  }
  .speak {
    border: none;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 7px;
  }
  .speak:hover {
    background: #e9e9e9;
  }
  .speak:active {
    transform: scale(.92);
  }
</style>
</head>

<body>
<div class="container">
  <h1>Chữ cái Hy Lạp</h1>
  <div class="subtitle">Bấm vào 🔊 để nghe phát âm tiếng Anh</div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Chữ hoa</th>
        <th>Chữ thường</th>
        <th>Tên</th>
        <th>Phát âm</th>
        <th>🔊</th>
      </tr>
    </thead>
    <tbody id="greekTable"></tbody>
  </table>
</div>

<script>
const greek = [
  ["Α", "α", "Alpha", "AL-fuh"],
  ["Β", "β", "Beta", "BAY-tuh"],
  ["Γ", "γ", "Gamma", "GAM-uh"],
  ["Δ", "δ", "Delta", "DEL-tuh"],
  ["Ε", "ε", "Epsilon", "EP-sih-lon"],
  ["Ζ", "ζ", "Zeta", "ZAY-tuh"],
  ["Η", "η", "Eta", "AY-tuh"],
  ["Θ", "θ", "Theta", "THAY-tuh"],
  ["Ι", "ι", "Iota", "eye-OH-tuh"],
  ["Κ", "κ", "Kappa", "KAP-uh"],
  ["Λ", "λ", "Lambda", "LAM-duh"],
  ["Μ", "μ", "Mu", "MYOO"],
  ["Ν", "ν", "Nu", "NOO"],
  ["Ξ", "ξ", "Xi", "ZYE"],
  ["Ο", "ο", "Omicron", "OH-mih-kron"],
  ["Π", "π", "Pi", "PIE"],
  ["Ρ", "ρ", "Rho", "ROH"],
  ["Σ", "σ", "Sigma", "SIG-muh"],
  ["Τ", "τ", "Tau", "TOW"],
  ["Υ", "υ", "Upsilon", "OOP-sih-lon"],
  ["Φ", "φ", "Phi", "FYE"],
  ["Χ", "χ", "Chi", "KYE"],
  ["Ψ", "ψ", "Psi", "SYE"],
  ["Ω", "ω", "Omega", "oh-MEG-uh"]
];

const table = document.getElementById("greekTable");

greek.forEach((g, i) => {
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>${i + 1}</td>
    <td class="symbol">${g[0]}</td>
    <td class="symbol">${g[1]}</td>
    <td class="name">${g[2]}</td>
    <td class="pronunciation">${g[3]}</td>
    <td>
      <button class="speak"
              title="Phát âm ${g[2]}"
              onclick="speak('${g[2]}')">🔊</button>
    </td>
  `;

  table.appendChild(tr);
});

function speak(text) {
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.8;
  utterance.pitch = 1.0;

  window.speechSynthesis.speak(utterance);
}
</script>
</body>
</html>
